    <!-- Body with three slots -->
    <path fill-rule="evenodd" d="
      M10 19 h44 l-3.6 39 a4 4 0 0 1 -4 3.6 h-28.8 a4 4 0 0 1 -4 -3.6 z
      M18.25 25.75 a1.75 1.75 0 0 1 3.5 0 v28.5 a1.75 1.75 0 0 1 -3.5 0 z
      M30.25 25.75 a1.75 1.75 0 0 1 3.5 0 v28.5 a1.75 1.75 0 0 1 -3.5 0 z
      M42.25 25.75 a1.75 1.75 0 0 1 3.5 0 v28.5 a1.75 1.75 0 0 1 -3.5 0 z"/>
  </g>
</svg>
